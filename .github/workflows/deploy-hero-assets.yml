name: Deploy hero assets to VIC Storage

on:
  push:
    branches: [feat/production-hero-assets]
    paths:
      - ".github/workflows/deploy-hero-assets.yml"
      - "tools/hero-assets/**"
      - "png/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: https://jemyrlzpsmtpveulrhgi.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_la4Zwo6DUHwtY1aQ3HijHA_WkgWOHik
      BUCKET: hero-assets
      PREFIX: hero/v1

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/hero-assets/package.json

      - name: Install isolated asset tooling
        run: npm install --prefix tools/hero-assets --no-audit --no-fund

      - name: Encode production AVIF and WebP sets
        run: |
          node tools/hero-assets/optimize.mjs \
            --input png \
            --output artifacts/hero-sequence \
            --desktop-width 1280 \
            --mobile-width 800 \
            --avif-quality 56 \
            --webp-quality 82 \
            --concurrency 2

      - name: Build runtime manifest
        run: node tools/hero-assets/runtime-manifest.mjs

      - name: Upload frame sets and runtime manifest
        shell: bash
        run: |
          set -euo pipefail

          upload() {
            local local_path="$1"
            local remote_path="$2"
            local content_type="$3"
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
              -H "Content-Type: ${content_type}" \
              --data-binary "@${local_path}" \
              "${SUPABASE_URL}/storage/v1/object/${BUCKET}/${PREFIX}/${remote_path}" >/dev/null
          }

          for profile in desktop mobile; do
            for file in artifacts/hero-sequence/${profile}/avif/*.avif; do
              upload "$file" "${profile}/avif/$(basename "$file")" "image/avif"
            done
            for file in artifacts/hero-sequence/${profile}/webp/*.webp; do
              upload "$file" "${profile}/webp/$(basename "$file")" "image/webp"
            done
          done

          upload artifacts/hero-sequence/runtime-manifest.json manifest.json application/json
          echo "Published hero sequence to ${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${PREFIX}"

      - name: Print production base URL
        run: echo "NEXT_PUBLIC_HERO_SEQUENCE_BASE_URL=${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${PREFIX}"
