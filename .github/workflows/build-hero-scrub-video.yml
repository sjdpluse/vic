name: Build hero scrub video

on:
  push:
    branches: [fix/hero-scroll-smoothing]
    paths:
      - ".github/workflows/build-hero-scrub-video.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/hero-scroll-smoothing

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Encode seek-optimized hero video
        run: |
          mkdir -p public/hero
          ffmpeg -y \
            -framerate 24 \
            -i 'png/ezgif-frame-%03d.png' \
            -vf 'scale=960:540:flags=lanczos,format=yuv420p' \
            -c:v libx264 \
            -preset medium \
            -crf 28 \
            -g 1 \
            -keyint_min 1 \
            -bf 0 \
            -movflags +faststart \
            -an \
            public/hero/renovation-scrub.mp4

      - name: Verify output
        run: |
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames \
            -show_entries format=duration,size \
            -of json \
            public/hero/renovation-scrub.mp4
          test "$(ffprobe -v error -select_streams v:0 -skip_frame nokey -show_entries frame=best_effort_timestamp_time -of csv=p=0 public/hero/renovation-scrub.mp4 | wc -l)" -ge 190

      - name: Commit generated video
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/hero/renovation-scrub.mp4
          git diff --cached --quiet && exit 0
          git commit -m 'build: add seek-optimized hero video'
          git push origin HEAD:fix/hero-scroll-smoothing
