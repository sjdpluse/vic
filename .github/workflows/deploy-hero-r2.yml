name: Deploy hero assets to Cloudflare R2

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  deploy-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_ID: "11273288982"
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      PREFIX: hero/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download reviewed artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -L \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o hero-frame-sequence.zip
          mkdir -p artifacts/hero-sequence
          unzip -q hero-frame-sequence.zip -d artifacts/hero-sequence

      - name: Build runtime manifest
        run: node tools/hero-assets/runtime-manifest.mjs

      - name: Configure AWS CLI for R2
        run: |
          aws configure set aws_access_key_id "$R2_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$R2_SECRET_ACCESS_KEY"
          aws configure set region auto

      - name: Upload immutable hero assets
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync artifacts/hero-sequence/desktop/avif "s3://${R2_BUCKET}/${PREFIX}/desktop/avif" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public,max-age=31536000,immutable" \
            --content-type image/avif
          aws s3 sync artifacts/hero-sequence/desktop/webp "s3://${R2_BUCKET}/${PREFIX}/desktop/webp" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public,max-age=31536000,immutable" \
            --content-type image/webp
          aws s3 sync artifacts/hero-sequence/mobile/avif "s3://${R2_BUCKET}/${PREFIX}/mobile/avif" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public,max-age=31536000,immutable" \
            --content-type image/avif
          aws s3 sync artifacts/hero-sequence/mobile/webp "s3://${R2_BUCKET}/${PREFIX}/mobile/webp" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public,max-age=31536000,immutable" \
            --content-type image/webp
          aws s3 cp artifacts/hero-sequence/runtime-manifest.json "s3://${R2_BUCKET}/${PREFIX}/manifest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public,max-age=300" \
            --content-type application/json

      - name: Print production origin
        run: echo "NEXT_PUBLIC_HERO_SEQUENCE_BASE_URL=${R2_PUBLIC_BASE_URL%/}/${PREFIX}"
